name: Commit Messages

# Runs the commit-msg hook on every commit of a pull request, because a local hook can be skipped
# (--no-verify) or not installed. Merge commits are left out.
on:
  pull_request:
    branches:
      - master

concurrency:
  group: commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check every commit message
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            if ! sh .githooks/commit-msg "$RUNNER_TEMP/message"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha")"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Reword these commits (git rebase -i, 'reword') and force-push the branch."
          fi
          exit $failed
